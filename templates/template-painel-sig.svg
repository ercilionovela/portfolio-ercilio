<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="800" viewBox="0 0 1130 800" font-family="Georgia, 'Times New Roman', serif">
  <!-- Modelo: Painel SIG — mapa + painel de dados (A4 horizontal) -->
  <rect width="1130" height="800" fill="#0f2844"/>

  <!-- Cabeçalho -->
  <rect x="30" y="30" width="1070" height="80" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="565" y="68" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2844" letter-spacing="1">PAINEL DE ANÁLISE ESPACIAL</text>
  <text x="565" y="94" text-anchor="middle" font-size="13" fill="#5a6270" font-family="Arial">[Área de estudo] — [mês/ano]</text>

  <!-- Painel do mapa (esquerda) -->
  <rect x="30" y="130" width="700" height="520" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="380" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f2844">Mapa principal</text>
  <rect x="60" y="185" width="640" height="440" fill="#e8e4de" stroke="#0f2844" stroke-width="1.5"/>
  <path d="M90 220 L340 200 L420 340 L300 470 L130 430 Z" fill="#c4885b"/>
  <path d="M340 200 L560 230 L600 420 L420 340 Z" fill="#e8d5c0"/>
  <path d="M130 430 L300 470 L360 590 L110 580 Z" fill="#b47a3d"/>
  <path d="M420 340 L600 420 L560 590 L360 590 L300 470 Z" fill="#f0e3d3"/>

  <!-- Rosa dos ventos no mapa -->
  <g transform="translate(640,240)">
    <circle r="24" fill="#ffffff" stroke="#0f2844" stroke-width="1.2"/>
    <path d="M0 -20 L5 0 L0 6 L-5 0 Z" fill="#0f2844"/>
    <text y="-28" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f2844">N</text>
  </g>

  <!-- Painel lateral (direita) -->
  <rect x="750" y="130" width="350" height="250" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="770" y="168" font-size="15" font-weight="bold" fill="#0f2844">Indicadores</text>
  <rect x="770" y="190" width="130" height="34" fill="#f0e3d3"/>
  <text x="782" y="212" font-size="12" fill="#171717" font-family="Arial">Área total: ___ km²</text>
  <rect x="770" y="236" width="130" height="34" fill="#e8d5c0"/>
  <text x="782" y="258" font-size="12" fill="#171717" font-family="Arial">População: ___</text>
  <rect x="920" y="190" width="160" height="80" fill="#faf9f7" stroke="#0f2844" stroke-width="1"/>
  <text x="1000" y="224" text-anchor="middle" font-size="13" fill="#5a6270" font-family="Arial">[valor-chave]</text>
  <text x="1000" y="248" text-anchor="middle" font-size="11" fill="#5a6270" font-family="Arial">destaque</text>

  <!-- Mini-gráfico de barras -->
  <rect x="770" y="290" width="26" height="60" fill="#b47a3d"/>
  <rect x="810" y="310" width="26" height="40" fill="#c4885b"/>
  <rect x="850" y="280" width="26" height="70" fill="#8f5f2e"/>
  <rect x="890" y="325" width="26" height="25" fill="#d9b28a"/>
  <line x1="760" y1="350" x2="1080" y2="350" stroke="#5a6270" stroke-width="1"/>

  <!-- Legenda do painel -->
  <rect x="750" y="400" width="350" height="120" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="750" y="400" width="350" height="28" fill="#1e3a5f"/>
  <text x="925" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">LEGENDA</text>
  <rect x="770" y="446" width="20" height="13" fill="#8f5f2e"/>
  <text x="800" y="457" font-size="11" fill="#171717" font-family="Arial">Classe 1</text>
  <rect x="770" y="472" width="20" height="13" fill="#b47a3d"/>
  <text x="800" y="483" font-size="11" fill="#171717" font-family="Arial">Classe 2</text>
  <rect x="940" y="446" width="20" height="13" fill="#e8d5c0"/>
  <text x="970" y="457" font-size="11" fill="#171717" font-family="Arial">Classe 3</text>
  <rect x="940" y="472" width="20" height="13" fill="#f0e3d3"/>
  <text x="970" y="483" font-size="11" fill="#171717" font-family="Arial">Classe 4</text>

  <!-- Notas / texto -->
  <rect x="750" y="540" width="350" height="110" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="770" y="572" font-size="14" font-weight="bold" fill="#0f2844">Notas de análise</text>
  <text x="770" y="596" font-size="11" fill="#5a6270" font-family="Arial">[Escreve aqui 2–3 linhas de</text>
  <text x="770" y="614" font-size="11" fill="#5a6270" font-family="Arial">conclusão da análise espacial.]</text>

  <!-- Escala e rodapé -->
  <g transform="translate(60,690)">
    <rect width="35" height="8" fill="#ffffff"/>
    <rect x="35" width="35" height="8" fill="#0f2844" stroke="#ffffff"/>
    <rect x="70" width="35" height="8" fill="#ffffff"/>
    <text y="24" font-size="11" fill="#ffffff" font-family="Arial">0</text>
    <text x="105" y="24" font-size="11" text-anchor="end" fill="#ffffff" font-family="Arial">30 km</text>
  </g>
  <text x="1100" y="710" text-anchor="end" font-size="11" fill="#ffffff" font-family="Arial">Elaborado por: [nome do autor]  |  Fonte: [fonte dos dados]  |  Datum: WGS84</text>
</svg>
